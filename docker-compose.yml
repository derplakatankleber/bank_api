services:
  bank-api:
    build: .
    image: bank-api-node:latest
    restart: unless-stopped
    environment:
      BANK_APP_KEY: ${BANK_APP_KEY:-}
      BANK_API_SESSION_SECRET: ${BANK_API_SESSION_SECRET:-insecure-development-secret}
      BANK_API_URL: ${BANK_API_URL:-https://api.comdirect.de/api/}
      BANK_API_DB: /app/data/bank_data.db
      COMDIRECT_OAUTH_URL: ${COMDIRECT_OAUTH_URL:-https://api.comdirect.de}
      COMDIRECT_CLIENT_ID: ${COMDIRECT_CLIENT_ID:-}
      COMDIRECT_CLIENT_SECRET: ${COMDIRECT_CLIENT_SECRET:-}
      COMDIRECT_USERNAME: ${COMDIRECT_USERNAME:-}
      COMDIRECT_PASSWORD: ${COMDIRECT_PASSWORD:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - bank-api-data:/app/data

volumes:
  bank-api-data:
